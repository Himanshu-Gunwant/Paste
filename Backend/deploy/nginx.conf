# Nginx front for the paste backend (docs/ARCHITECTURE.md §17).
# Target: /etc/nginx/sites-available/paste → symlink into sites-enabled.
# TLS certificates provisioned with: certbot --nginx -d paste.example.com
#
# Security posture:
#   - The app runs with TRUST_PROXY=1 and trusts exactly one hop. Nginx
#     OVERWRITES X-Forwarded-For with the socket peer address so a client
#     cannot spoof its IP to bypass rate limits.

upstream paste_api {
    server 127.0.0.1:3000;
    server 127.0.0.1:3001;
    keepalive 32;
}

# Coarse global guard; fine-grained per-route limits live in the app (Redis).
limit_req_zone $binary_remote_addr zone=global:10m rate=10r/s;

server {
    listen 80;
    server_name paste.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name paste.example.com;

    ssl_certificate     /etc/letsencrypt/live/paste.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/paste.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    # HSTS + baseline headers (the app layer adds Helmet headers on top).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Paste content limit: 1 MB content + JSON envelope overhead.
    client_max_body_size 2m;
    client_body_timeout 15s;

    gzip on;
    gzip_types application/json text/plain text/css;

    location = /healthz {
        proxy_pass http://paste_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        access_log off;
    }

    location = /readyz {
        proxy_pass http://paste_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        access_log off;
    }

    # Prometheus metrics — internal only, never public.
    location = /metrics {
        deny all;
    }

    location / {
        limit_req zone=global burst=20 nodelay;

        proxy_pass http://paste_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # Exactly one trusted hop: overwrite (never append) the client-supplied header.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }
}
