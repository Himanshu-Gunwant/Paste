name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://paste:paste_dev_password@localhost:5432/paste?schema=public
      REDIS_URL: redis://localhost:6379
      RUN_INTEGRATION: "1"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: paste
          POSTGRES_PASSWORD: paste_dev_password
          POSTGRES_DB: paste
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U paste"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Tests (unit + integration)
        run: npm test
